name: Annual rules review

on:
  schedule:
    - cron: '0 9 15 1 *'  # 15 janvier à 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date +%Y)
          cat > /tmp/issue-body.md <<'EOF'
          Vérification annuelle que les règles définies dans `src/generate.py` reflètent toujours le droit en vigueur ou la convention dominante.

          ## Check-list

          - [ ] **Saint-Valentin** — Tradition immémoriale (14 février, date fixe). Rien à vérifier sauf curiosité.
          - [ ] **Fête des Mères** — Loi n° 50-577 du 24 mai 1950 : https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000000886326 — vérifier l'absence de mention « modifié par » ou « abrogé ».
          - [ ] **Fête des Pères** — Décret de 1952. Sources secondaires : Wikipédia, service-public.fr.
          - [ ] **Fête des Grands-Mères** — Page Wikipédia : https://fr.wikipedia.org/wiki/F%C3%AAte_des_grands-m%C3%A8res + site Café Grand'Mère.
          - [ ] **Journée mondiale des grands-parents** — Vatican News : https://www.vaticannews.va/fr/pape/news/2021-01/pape-francois-angelus-annonce-journee-mondiale-grands-parents.html
          - [ ] **Fête des Grands-Pères** — Page Wikipédia : https://fr.wikipedia.org/wiki/F%C3%AAte_des_grands-p%C3%A8res (création par Franck Izquierdo, 2008).

          ## Si une règle a changé

          1. Modifier la fonction concernée dans `src/generate.py`.
          2. Ajouter ou ajuster les dates pinnées dans `src/tests.py`.
          3. Déclencher manuellement le workflow « update-calendar » pour propager.

          *Issue créée automatiquement par `.github/workflows/review-rules.yml`.*
          EOF
          gh issue create \
            --title "Vérification annuelle $YEAR : les règles sont-elles toujours en vigueur ?" \
            --body-file /tmp/issue-body.md
