name: sync-rulesets

# Requires an ADMIN_TOKEN repo secret: a fine-grained PAT scoped to this repo
# with "Administration: Read and write". The default GITHUB_TOKEN cannot manage
# rulesets, so the job is skipped (with a warning) when ADMIN_TOKEN is absent.
on:
  push:
    branches: [main]
    paths:
      - '.github/rulesets/**'
      - '.github/workflows/sync-rulesets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check for ADMIN_TOKEN
        id: token
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::ADMIN_TOKEN secret not set ; ruleset sync skipped. Create a fine-grained PAT scoped to this repo with 'Administration: Read and write' and add it as the ADMIN_TOKEN secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'

      - name: Apply rulesets
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for file in .github/rulesets/*.json; do
            name=$(jq -r .name "$file")
            existing_id=$(gh api "repos/$REPO/rulesets" \
              --jq ".[] | select(.name == \"$name\") | .id" | head -n1)
            if [ -n "$existing_id" ]; then
              echo "Updating ruleset '$name' (id=$existing_id) from $file"
              gh api -X PUT "repos/$REPO/rulesets/$existing_id" --input "$file"
            else
              echo "Creating ruleset '$name' from $file"
              gh api -X POST "repos/$REPO/rulesets" --input "$file"
            fi
          done
