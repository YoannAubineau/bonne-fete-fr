[project]
name = "bonne-fete-fr"
version = "0.1.0"
description = "Public iCalendar feed for the French family celebration days"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "icalendar>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "PERF401", # manual list comprehension (use `list.extend`)
    "SIM108",  # use ternary instead of if-else block
    "T201",    # `print` found
]

[tool.ruff.lint.per-file-ignores]
"src/tests.py" = [
    "S101",   # use of `assert` (intrinsic to pytest)
    "INP001", # implicit namespace package (tests.py is a script)
]

[tool.ruff.format]
