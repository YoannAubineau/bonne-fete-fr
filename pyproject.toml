[project]
name = "bonne-fete-fr"
version = "0.1.0"
description = "Public iCalendar feed for the French family celebration days"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "icalendar>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "ANN",
    "T201",
    "PLR2004",
    "EM101",
    "EM102",
    "TRY003",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"src/tests.py" = [
    "S101",
    "INP001",
]

[tool.ruff.format]
