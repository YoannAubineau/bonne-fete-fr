[project]
name = "bonne-fete-fr"
version = "0.1.0"
description = "Public iCalendar feed for the French relational observances"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "icalendar>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py"]
pythonpath = ["src"]
addopts = ["--cov=src", "--cov-report=term-missing", "--cov-branch"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/tests.py", "src/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["src"]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "PERF401", # manual list comprehension (use `list.extend`)
    "SIM108",  # use ternary instead of if-else block
    "T201",    # `print` found
]

[tool.ruff.lint.per-file-ignores]
"src/tests.py" = [
    "S101",   # use of `assert` (intrinsic to pytest)
    "INP001", # implicit namespace package (tests.py is a script)
]
"src/test_*.py" = [
    "S101",    # use of `assert` (intrinsic to pytest)
    "INP001",  # implicit namespace package (test files are scripts)
    "PLR2004", # magic value comparison (intrinsic to literal-expected assertions)
    "PLR0913", # too many arguments (test builders take one kwarg per overridable field)
    "SLF001",  # private member access (tests may exercise `_unfold` and `_year_of`)
]

[tool.ruff.format]
